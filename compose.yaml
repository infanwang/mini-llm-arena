services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:?required}
    secrets: [db_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  worker:
    build: .
    command: ["celery", "-A", "src.tasks", "worker", "-l", "INFO", "--concurrency", "4"]
    env_file: [.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { replicas: 2 }

  beat:
    build: .
    command: ["celery", "-A", "src.tasks", "beat", "-l", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    env_file: [.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 1 }          # 硬约束：Beat 不可多副本

  rating-job:
    build: .
    command: ["python", "jobs/run_rating.py"]
    env_file: [.env]
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ["batch"]
    restart: "no"

  # ---- vLLM 本地端点（可选，纯外部 API 模式删除此服务） ----
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: ["--model", "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}",
  #             "--gpu-memory-utilization", "${GPU_UTIL:-0.93}",
  #             "--api-key", "${VLLM_API_KEY:-sk-local}"]
  #   environment:
  #     VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   ports: ["8000:8000"]
  #   volumes:
  #     - ~/.cache/huggingface:/root/.cache/huggingface

  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    profiles: ["monitoring"]

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
  redisdata:
